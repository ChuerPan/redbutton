<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>别点红色按钮 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            font-size: 2em;
        }
        .header-info {
            text-align: center;
            margin-bottom: 20px;
            color: #aaa;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(0,0,0,0.3);
            color: #ffd700;
            font-weight: bold;
        }
        tr:hover { background: rgba(255,255,255,0.05); }
        .rank-gold { color: #ffd700; font-weight: bold; }
        .rank-silver { color: #c0c0c0; font-weight: bold; }
        .rank-bronze { color: #cd7f32; font-weight: bold; }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover { background: #c0392b; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .page-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .page-btn:hover { background: #2980b9; }
        .page-btn:disabled { background: #666; cursor: not-allowed; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }
        .stat-label { color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 别点红色按钮 - 管理后台</h1>
        
        <div class="stats-grid" id="stats-grid"></div>
        
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>用户ID</th>
                    <th>用户名</th>
                    <th>金币</th>
                    <th>死亡次数</th>
                    <th>概率</th>
                    <th>时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 50;

        async function loadStats() {
            try {
                const res = await fetch('/admin/api/leaderboard?limit=1');
                const { total } = await res.json();
                
                document.getElementById('stats-grid').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${total || 0}</div>
                        <div class="stat-label">总记录数</div>
                    </div>
                `;
            } catch (e) {
                console.error('加载统计失败', e);
            }
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch(`/admin/api/leaderboard?limit=${pageSize}&page=${currentPage}`);
                const { data, total } = await res.json();
                
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = data.map((item, index) => {
                    const rank = (currentPage - 1) * pageSize + index + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = 'rank-gold';
                    else if (rank === 2) rankClass = 'rank-silver';
                    else if (rank === 3) rankClass = 'rank-bronze';
                    
                    return `
                        <tr>
                            <td class="${rankClass}">#${rank}</td>
                            <td>${item.user_id}</td>
                            <td>${item.user_name || '匿名'}</td>
                            <td>${item.coins}</td>
                            <td>${item.death_count}</td>
                            <td>${item.probability ? item.probability.toFixed(8) + '%' : '-'}</td>
                            <td>${new Date(item.created_at).toLocaleString()}</td>
                            <td><button class="btn-delete" onclick="deleteEntry(${item.id})">删除</button></td>
                        </tr>
                    `;
                }).join('');
                
                const totalPages = Math.ceil(total / pageSize);
                document.getElementById('pagination').innerHTML = `
                    <button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
                    <span>第 ${currentPage} / ${totalPages} 页</span>
                    <button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
                `;
            } catch (e) {
                console.error('加载排行榜失败', e);
            }
        }

        async function deleteEntry(id) {
            if (!confirm('确定要删除这条记录吗？')) return;
            try {
                await fetch(`/admin/api/leaderboard/${id}`, { method: 'DELETE' });
                loadLeaderboard();
                loadStats();
            } catch (e) {
                alert('删除失败');
            }
        }

        function changePage(delta) {
            currentPage += delta;
            loadLeaderboard();
        }

        loadStats();
        loadLeaderboard();
    </script>
</body>
</html>
